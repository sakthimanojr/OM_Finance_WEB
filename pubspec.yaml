name: finance_app
description: Finance company loan management app (customer + admin).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # Local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Routing
  go_router: ^14.2.0

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0
  cached_network_image: ^3.3.1
  path_provider: ^2.1.4
  open_filex: ^4.5.0

  # Utilities
  image_picker: ^1.1.2
  file_picker: ^8.0.6
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.5
  logger: ^2.4.0
  razorpay_flutter: ^1.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
